# People Inbox — all the knobs live here. Edit, commit, push. The next run uses them.

owner_name: "Rishul"            # the AI never saves you as a contact
owner_links: ["Jabalpur", "Madhya Pradesh", "IIT Bombay", "economics", "AI agents"]   # rare links the AI looks for (edit anytime)
timezone: "Asia/Kolkata"

# ---- Notion IDs (not secrets). "Setup Notion" fills these in and commits them. ----
ids:
  NOTION_PARENT_PAGE_ID: "40d943f7e3a8814fa71ae06cf623aeb0"   # Life → Professional (same page as Content Inbox)
  PEOPLE_DB_ID: "7b59bf6a-3068-40aa-80f2-65ea183568bc"
  PEOPLE_DS_ID: "b804cf67-2563-4702-8509-2a5a16a8b733"
  INTERACTIONS_DB_ID: "a8220268-de2d-4186-9657-10af29ba6691"
  INTERACTIONS_DS_ID: "2f219745-5ffa-4669-b8be-5b8d959fc810"
  PROMISES_DB_ID: "a30078f3-3d01-491d-9a81-d622357ff737"
  PROMISES_DS_ID: "4e807ebb-dcab-46c0-905a-c8f1cbb6938b"

# ---- Gemini (free tier; same key as Content Inbox is fine) ----
gemini:
  model: "gemini-3.5-flash-lite"      # reads voice notes, photos and text; ~500 free requests/day
  fallback_model: "gemini-3.6-flash"  # used if the main model errors

# ---- Tiers: days until the next contact after each touch (from the networking skill) ----
tiers:
  Inner circle: 0       # 0 = no reminder; these relationships are never "managed"
  Ally: 21
  Tier 1: 30
  Tier 2: 90
  Tier 3: 365
  Dormant: 0
new_person_tier: "Tier 1"     # new contacts stay in Tier 1 until you move them
first_follow_up_days: 1       # a new person's first "next contact" = the 24-hour follow-up
daily_pings: 3                # the 09:00 message suggests this many people to ping (Allies first)

worlds: ["Startups & tech", "VC & founders", "Policy & politics", "Famous & powerful",
         "Creators & media", "School and work roots", "Friends", "Family", "Other"]

# ---- Promises with no date get these defaults ----
promise_due_days:
  me: 2       # what you promised: due in 2 days
  them: 7     # what they promised you: check in 7 days

event_hours: 4          # /event tags every capture for this many hours
pending_max_tries: 3    # a capture that failed (Gemini busy) is retried this many runs
